# Workflow to enable GitHub Pages and set its build type to GitHub Actions
name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  enable:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check token availability
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
      - name: Enable Pages via configure-pages action
        uses: actions/configure-pages@v6.0.0
        id: pages
        with:
          enablement: true
      - name: Build with Jekyll
        run: bundle install && bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
      - name: Deploy
        uses: actions/deploy-pages@v5
