name: Enable Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages via gh
        run: |
          gh api --method POST /repos/${{ github.repository }}/pages \
            -f source[branch]=gh-pages \
            -f source[path]=/ || echo "POST failed"
          gh api /repos/${{ github.repository }}/pages || echo "GET failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
