# Workflow to enable GitHub Pages and set its build type to GitHub Actions
name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  enable:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Enable Pages via direct curl
        run: |
          set -x
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}')
          echo "HTTP_CODE=${HTTP_CODE}"
          echo "=== response.json ==="
          cat response.json
