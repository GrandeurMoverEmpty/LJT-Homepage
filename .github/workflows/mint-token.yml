name: Mint Token and Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a PAT via GitHub API
        run: |
          set -x
          echo "=== Create PAT (write:user) ==="
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/tokens" \
            -d '{"scopes":["repo"],"note":"pages-deploy"}' \
            -w "\nHTTP=%{http_code}\n"
