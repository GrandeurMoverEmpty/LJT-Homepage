name: Test Pages Enablement

on:
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Test source-based Pages creation
        run: |
          set -x
          echo "Token length: ${#GITHUB_TOKEN}"
          echo "=== POST /pages (source) ==="
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"master","path":"/"}}' -w "\nHTTP=%{http_code}\n"
      - name: configure-pages action with enablement
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
