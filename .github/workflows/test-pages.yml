name: Test Pages Enablement

on:
  workflow_dispatch:

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Pages API endpoints with GITHUB_TOKEN
        run: |
          set -x
          echo "=== GET /pages ==="
          curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -w "\nHTTP=%{http_code}\n"
          echo "=== POST /pages (workflow) ==="
          curl -sS -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow"}' -w "\nHTTP=%{http_code}\n"
