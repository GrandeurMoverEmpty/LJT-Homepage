name: Test Pages Enablement

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check token availability
        run: |
          echo "Token length: ${#GITHUB_TOKEN}"
      - name: configure-pages action with enablement
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
